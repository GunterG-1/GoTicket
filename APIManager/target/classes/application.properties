# Configuración del Servidor
server.port=8080
server.servlet.context-path=/

# Configuración de Nombre de la Aplicación
spring.application.name=GoTicket API Gateway

# Configuración Base de Datos H2
spring.datasource.url=jdbc:h2:mem:apimanagerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# CORS para frontend
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://192.168.*:5173,http://172.20.32.1:5173

# URLs de los microservicios detrás del gateway
catalogo.url=${CATALOGO_URL:http://localhost:8081}
inventario.url=${INVENTARIO_URL:http://localhost:8082}
orden.url=${ORDEN_URL:http://localhost:8083}
pagos.url=${PAGOS_URL:http://localhost:8084}

# JWT para autenticación interna del gateway
app.jwt.secret=${GOTICKET_JWT_SECRET:}
app.jwt.expiration-ms=3600000


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.oauth2.frontend-success-url=${FRONTEND_OAUTH_SUCCESS_URL:http://localhost:5173/#oauth2}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
