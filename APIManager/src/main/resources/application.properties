# Configuración del Servidor
server.port=8080
server.servlet.context-path=/
server.forward-headers-strategy=framework

# Configuración de Nombre de la Aplicación
spring.application.name=GoTicket API Gateway

# Configuración Base de Datos H2
spring.datasource.url=jdbc:h2:mem:apimanagerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# CORS para frontend (Incluye entornos locales y soporte para producción web)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# URLs de los microservicios detrás del gateway (Alineadas con el docker-compose-public.yml)
catalogo.url=${URI_CATALOGO:http://localhost:8081}
inventario.url=${URI_INVENTARIO:http://localhost:8082}
orden.url=${URI_ORDEN:http://localhost:8083}
pagos.url=${URI_PAGOS:http://localhost:8084}

# JWT para autenticación interna del gateway
app.jwt.secret=${JWT_SECRET:change-me-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
goticket.internal.api-token=${GOTICKET_INTERNAL_API_TOKEN:}

spring.security.oauth2.client.registration.google.client-id=${OAUTH2_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.oauth2.frontend-success-url=${FRONTEND_OAUTH_SUCCESS_URL:http://localhost:5173/#oauth2}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.urls[0].name=API Manager
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Catálogo de eventos
springdoc.swagger-ui.urls[1].url=/docs/catalogo
springdoc.swagger-ui.urls[2].name=Inventario
springdoc.swagger-ui.urls[2].url=/docs/inventario
springdoc.swagger-ui.urls[3].name=Orden
springdoc.swagger-ui.urls[3].url=/docs/orden
springdoc.swagger-ui.urls[4].name=Pagos
springdoc.swagger-ui.urls[4].url=/docs/pagos