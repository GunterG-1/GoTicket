spring.application.name=Pagos

server.port=8084
goticket.internal.api-token=${GOTICKET_INTERNAL_API_TOKEN:}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/goticket_pagos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

goticket.payment.expiration-minutes=${GOTICKET_PAYMENT_EXPIRATION_MINUTES:5}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
spring.aws.region=${AWS_REGION:us-east-1}
spring.aws.endpoint=${AWS_ENDPOINT:}
goticket.aws.sns.topic-arn=${GOTICKET_SNS_TOPIC_ARN:}
goticket.aws.event.approved=${GOTICKET_EVENT_APPROVED:pago.aprobado}
goticket.aws.event.failed=${GOTICKET_EVENT_FAILED:pago.fallido}
goticket.aws.queue.order-created-url=${GOTICKET_PAGOS_ORDER_CREATED_QUEUE_URL:}
goticket.aws.queue.payment-failed-url=${GOTICKET_PAGOS_PAYMENT_FAILED_QUEUE_URL:}
goticket.aws.poll-ms=${GOTICKET_AWS_POLL_MS:1000}
