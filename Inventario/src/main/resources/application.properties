spring.application.name=Inventario

server.port=8082
catalogo.url=${CATALOGO_URL:http://localhost:8081}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/goticket_inventario?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
goticket.reservation.minutes=${GOTICKET_RESERVATION_MINUTES:5}

logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=info

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
goticket.rabbit.exchange=${GOTICKET_RABBIT_EXCHANGE:goticket.events}
goticket.rabbit.order-queue=${GOTICKET_INVENTORY_QUEUE:inventario.orden.creada}
goticket.rabbit.order-routing-key=${GOTICKET_ORDER_ROUTING_KEY:orden.creada}
goticket.rabbit.payment-approved-queue=${GOTICKET_INVENTORY_APPROVED_QUEUE:inventario.pago.aprobado}
goticket.rabbit.payment-failed-queue=${GOTICKET_INVENTORY_FAILED_QUEUE:inventario.pago.fallido}
goticket.rabbit.payment-approved-key=${GOTICKET_PAYMENT_APPROVED_KEY:pago.aprobado}
goticket.rabbit.payment-failed-key=${GOTICKET_PAYMENT_FAILED_KEY:pago.fallido}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
