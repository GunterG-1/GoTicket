spring.application.name=Inventario

server.port=8082
catalogo.url=${CATALOGO_URL:http://localhost:8081}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/goticket_inventario?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
goticket.reservation.minutes=${GOTICKET_RESERVATION_MINUTES:5}

logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=info

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
spring.aws.region=${AWS_REGION:us-east-1}
spring.aws.endpoint=${AWS_ENDPOINT:}
goticket.aws.sns.topic-arn=${GOTICKET_SNS_TOPIC_ARN:}
goticket.aws.queue.order-created-url=${GOTICKET_INVENTARIO_ORDER_CREATED_QUEUE_URL:}
goticket.aws.queue.payment-approved-url=${GOTICKET_INVENTARIO_PAYMENT_APPROVED_QUEUE_URL:}
goticket.aws.queue.payment-failed-url=${GOTICKET_INVENTARIO_PAYMENT_FAILED_QUEUE_URL:}
goticket.aws.poll-ms=${GOTICKET_AWS_POLL_MS:1000}
