spring.application.name=Orden

server.port=8083

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/goticket_orden?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
goticket.outbox.poll-ms=${GOTICKET_OUTBOX_POLL_MS:2000}

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
goticket.rabbit.exchange=${GOTICKET_RABBIT_EXCHANGE:goticket.events}
goticket.rabbit.order-routing-key=${GOTICKET_ORDER_ROUTING_KEY:orden.creada}
goticket.rabbit.payment-approved-queue=${GOTICKET_ORDER_APPROVED_QUEUE:orden.pago.aprobado}
goticket.rabbit.payment-failed-queue=${GOTICKET_ORDER_FAILED_QUEUE:orden.pago.fallido}
goticket.rabbit.payment-approved-key=${GOTICKET_PAYMENT_APPROVED_KEY:pago.aprobado}
goticket.rabbit.payment-failed-key=${GOTICKET_PAYMENT_FAILED_KEY:pago.fallido}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
