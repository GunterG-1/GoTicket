spring.application.name=Orden

server.port=8083

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/goticket_orden?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
inventario.url=${INVENTARIO_URL:http://localhost:8082}
goticket.internal.api-token=${GOTICKET_INTERNAL_API_TOKEN:}
goticket.outbox.poll-ms=${GOTICKET_OUTBOX_POLL_MS:2000}

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
spring.aws.region=${AWS_REGION:us-east-1}
spring.aws.endpoint=${AWS_ENDPOINT:}
goticket.aws.sns.topic-arn=${GOTICKET_SNS_TOPIC_ARN:}
goticket.aws.queue.payment-approved-url=${GOTICKET_ORDEN_PAYMENT_APPROVED_QUEUE_URL:}
goticket.aws.queue.payment-failed-url=${GOTICKET_ORDEN_PAYMENT_FAILED_QUEUE_URL:}
goticket.aws.poll-ms=${GOTICKET_AWS_POLL_MS:1000}
