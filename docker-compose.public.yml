services:
  apimanager:
    build: ./APIManager
    container_name: goticket_apimanager
    restart: unless-stopped
    env_file:
      - .env.public
    environment:
      SERVER_PORT: 8080
      URI_CATALOGO: http://${BACKEND_HOST}:8081
      URI_INVENTARIO: http://${BACKEND_HOST}:8082
      URI_ORDEN: http://${BACKEND_HOST}:8083
      URI_PAGOS: http://${BACKEND_HOST}:8084
    expose:
      - "8080"
    networks:
      - public

  frontend:
    build:
      context: ./Front-GoTicket
      args:
        VITE_API_MANAGER_URL: ""
    container_name: goticket_frontend
    restart: unless-stopped
    env_file:
      - .env.public
    environment:
      NGINX_ENVSUBST_FILTER: ^BACKEND_HOST$
    ports:
      - "80:80"
    depends_on:
      - apimanager
    networks:
      - public

networks:
  public:
